# Database settings
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bankapp}
spring.datasource.username=${DB_USER:cf9}
spring.datasource.password=${DB_PASSWORD:1}

spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# disable first time to generate create tables
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# make sure to use join fetch
spring.jpa.open-in-view=false

# JWT — the five properties below have no default in the code, so leaving any of
# them out makes the application fail to start with an unresolved placeholder.
# Override APP_SECURITY_SECRET_KEY per environment; the fallback is a throwaway
# key so the profile can be started locally without extra setup.
app.security.secret-key=${APP_SECURITY_SECRET_KEY:c3RhZ2luZy1vbmx5LWluc2VjdXJlLWtleS1kby1ub3QtcmV1c2UtMDAwMDA=}
app.security.jwt-expiration=10800000
app.security.jwt-issuer=https://api.codingfactory.gr

# Bank fees
bank.fee.checking=0.5
bank.fee.savings=1.0

# CORS
allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}

# File upload
file.upload.dir=uploads/
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
