# Database settings
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bankapp}
spring.datasource.username=${DB_USER:cf9}
spring.datasource.password=${DB_PASSWORD:1}

spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# disable first time to generate create tables
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Read from env var APP_SECURITY_SECRET_KEY; the fallback is a throwaway dev-only key, never used in prod
app.security.secret-key=${APP_SECURITY_SECRET_KEY:ZGV2LW9ubHktaW5zZWN1cmUta2V5LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi0wMDAw}
app.security.jwt-expiration=10800000
app.security.jwt-issuer=https://api.codingfactory.gr

bank.fee.checking=0.5
bank.fee.savings=1.0

# make sure to use join fetch
spring.jpa.open-in-view=false

allowed.origins=http://localhost:5173,http://localhost:3000,http://localhost:8080
file.upload.dir=uploads/

spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB