# Profile for tests that need a Spring context but no real database.
# Flyway stays off because the migrations are PostgreSQL-specific (BIGSERIAL,
# pg_get_serial_sequence, partial unique indexes), so Hibernate builds the schema
# from the entities instead. That is enough to prove the context wires up.
spring.datasource.url=jdbc:h2:mem:bankapp;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

app.security.secret-key=dGVzdC1vbmx5LWtleS1ub3QtdXNlZC1hbnl3aGVyZS1lbHNlLTAwMDA=
app.security.jwt-expiration=10800000
app.security.jwt-issuer=https://api.codingfactory.gr

allowed.origins=http://localhost:5173
file.upload.dir=build/tmp/test-uploads/
