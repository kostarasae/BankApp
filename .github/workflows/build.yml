name: build

# Runs what a reviewer would run on a fresh clone, so a change that only builds
# because of leftover state on someone's machine fails here instead of there.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # Pinned rather than relying on whatever the runner ships, so the frontend
      # steps below run against the same version the Gradle build uses.
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: bankApp/package-lock.json

      # Builds the backend and the React client and runs the JUnit suite. The
      # context test uses H2, so no database service is needed here.
      - name: Build and test the backend
        run: ./gradlew build --no-daemon

      - name: Install frontend dependencies
        working-directory: bankApp
        run: npm ci

      - name: Test the frontend
        working-directory: bankApp
        run: npm run test

      - name: Lint the frontend
        working-directory: bankApp
        run: npm run lint

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
