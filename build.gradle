plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.11'
    id 'io.spring.dependency-management' version '1.1.7'
    id "com.github.node-gradle.node" version "3.5.1"
}

group = 'gr.aueb.cf'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    implementation 'org.apache.tika:tika-core:3.2.3'

    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework.boot:spring-boot-starter-aop'


    // Source: https://mvnrepository.com/artifact/org.springdoc/springdoc-openapi-starter-webmvc-ui
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    // override for addressing vulnerability
}

springBoot {
    mainClass = 'gr.aueb.cf.restbankapp.RestBankAppApplication'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// -- React (bankApp/) frontend build using Node plugin (downloads Node if missing)
node {
    version = '20.19.0'
    download = true
    nodeProjectDir = file("${project.projectDir}/bankApp")
}

task buildReact(type: com.github.gradle.node.npm.task.NpmTask) {
    description = 'Build the React client (bankApp) with Vite'
    group = 'build'
    dependsOn npmInstall
    args = ['run', 'build']
    inputs.dir("${project.projectDir}/bankApp/src")
    inputs.file("${project.projectDir}/bankApp/package.json")
    outputs.dir("${project.projectDir}/bankApp/dist")
}

// Copy the built React app into the packaged static resources (served at /)
task copyReactDist(type: Copy) {
    dependsOn buildReact, tasks.named('processResources')
    from "${project.projectDir}/bankApp/dist"
    into "${layout.buildDirectory.get()}/resources/main/static"
}

tasks.named('classes') {
    dependsOn copyReactDist
}